# 3D Contribution Graph workflow (isometric 3D graph)
#
# KAISE LAGAYE:
# 1. Apne profile repo "RIZWANSHAIKH1410" me jaao
# 2. "Add file" -> "Create new file"
# 3. File ka naam rakho: .github/workflows/3d-contrib.yml
#    (dhyan rahe: .github folder ke andar workflows folder ke andar 3d-contrib.yml)
# 4. Neeche wala poora code paste karo
# 5. Commit karo, phir "Actions" tab me jaao
# 6. "GitHub-Profile-3D-Contrib" select karo -> "Run workflow" dabao
# 7. 2-3 minute me "profile-3d-contrib" naam ki branch ban jayegi
#    aur README me 3D graph dikhne lagega (roz auto-update hota hai)

name: GitHub-Profile-3D-Contrib

# GitHub ko is workflow me files push karne ki permission
permissions:
  contents: write

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v4
      - uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: profile-3d-contrib
          build_dir: profile-3d-contrib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
