# Snake workflow — contribution-snake animation ke liye
#
# KAISE LAGAYE:
# 1. Apne special profile repo (jo username naam wala hai) me jaao
# 2. "Add file" -> "Create new file"
# 3. File ka naam rakho: .github/workflows/snake.yml
#    (dhyan rahe: .github folder ke andar workflows folder ke andar snake.yml)
# 4. Neeche wala poora code paste karo
# 5. Commit — 12 ghante me ek baar snake auto-update hoga
#    (pehli baar turant chalane ke liye: Actions tab -> "Generate snake animation" -> Run workflow)

name: Generate snake animation

# GitHub ko is workflow me files push karne ki permission
permissions:
  contents: write

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate the snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
